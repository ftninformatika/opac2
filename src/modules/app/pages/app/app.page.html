<div class="app-page-wrapper" id="app-page-wrapper">
  <top-menu></top-menu>
  <div class="page-container">
    <main>
      <div class="container-fluid py-4">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>


 <!-- MDB4 Floating Action Button -->
 <div [style.display]="isChatOpen ? 'none' : 'block'"
      class="fixed-action-btn"
      style="bottom: 38px; right: 90px; position: fixed;"
      (click)="toggleChat()">
   <a class="btn-floating btn-large bisis-blue waves-effect waves-light">
     <i class="fas fa-comment"></i>
   </a>
</div>


 <!-- The Chat Window Container -->
 <div [style.display]="isChatOpen ? 'flex' : 'none'"
      class="z-depth-3 animated fadeIn"
      style="position: fixed; bottom: 30px; right: 30px;
            width: 400px; height: 600px; /* Adjust window size here */
            background: white; border-radius: 15px; overflow: hidden; z-index: 1040;
            flex-direction: column;">

   <!-- Header (Fixed Height) -->
   <div class="bisis-blue p-3 d-flex justify-content-between align-items-center text-white"
        style="flex: 0 0 auto;">
     <span class="font-weight-bold">Четко</span>
     <div>
       <button (click)="startNewConversation()" class="btn btn-sm btn-link text-white p-0 m-0 mr-3"
               title="Nova konverzacija">
         <i class="fas fa-redo-alt"></i>
       </button>
       <button (click)="isChatOpen = false" class="btn btn-sm btn-link text-white p-0 m-0">
         <i class="fas fa-times fa-lg"></i>
       </button>
     </div>
   </div>

   <!-- Deep Chat (Fills all remaining vertical and horizontal space). -->
   <deep-chat *ngIf="deepChatLoaded" #deepChatEl
     style="flex: 1 1 auto; width: 100%; height: 100%; border: none;"
     [request]="request" [textInput]="placeholderStyle" [messageStyles]="messageStyles"
   >
   </deep-chat>
 </div>


  <button
    backToTopButton
    class="
      btn btn-floating btn-large
      waves-light
      animated
      d-none
      back-to-top-button
    "
    mdbPageScroll
    mdbWavesEffect
    style="right: 35px; bottom: 35px"
    (click)="scrollToElement('app-page-wrapper')"
  >
    <i class="fas fa-arrow-up" style="color: black"></i>
  </button>
  <footer class="font-small" style="height: 65px">
    <div class="text-center py-3">
      <span style="color: #9e9e9e">Ⓒ </span>
      <span style="color: black"> БИСИС5</span>
    </div>
    <div class="text-center py-3" *ngIf="showCookieDiv">
      <div id="cookie-info-bar">
        <span i18n="@@kolacici">
          www.opac.bisis.rs koristi lične kolačiće i kolačiće trećih strana kako bi se poboljšalo Vaše iskustvo pregledanja
          veb sajta i pružila usluga u skladu sa Vašim željama. Ukoliko ste saglasni sa korišćenjem kolačića ljubazno Vas molimo da u nastavku označite
          "Prihvatam".
          <button style="margin-left: 20px" type="button" class="btn btn-danger" (click)="acceptCookie()">Prihvatam</button>
        </span>
      </div>
    </div>
  </footer>
</div>
